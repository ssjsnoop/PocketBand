<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Pocket Band: drums, piano, guitar, harp, xylophone and steel pan in your pocket. Loop, layer and learn songs.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Pocket Band">
<title>Pocket Band</title>
<style>
:root{
  --bg:#0a0f1f;--bg2:#111936;--ink:#eef2ff;--mut:#8f9bc4;--rec:#ff3b4f;--ok:#5cffb0;
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
svg{display:block}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- layout (pure CSS so rotation always re-fits) ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:var(--sat) var(--sar) var(--sab) var(--sal);
  background:radial-gradient(120% 80% at 50% 0%,#1b2552 0%,var(--bg) 60%)}
#panes{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:6px 6px 0}
#ctl{display:flex;flex-direction:column;gap:6px;padding:6px 8px 8px}
@media (orientation:landscape){
  #app{flex-direction:row}
  #panes{flex-direction:row;padding:6px 0 6px 6px}
  #ctl{width:196px;flex:none;overflow-y:auto;padding:6px 8px 6px 8px;touch-action:pan-y;justify-content:center}
}

/* ---------- pane ---------- */
.pane{--c:#ff7a59;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg2);border-radius:16px;border:1px solid #ffffff16;box-shadow:0 6px 24px #0008}
.pane[data-inst=drums]{--c:#ff7a59}.pane[data-inst=piano]{--c:#6ab0ff}.pane[data-inst=guitar]{--c:#ffb23e}
.pane[data-inst=harp]{--c:#c58bff}.pane[data-inst=xylo]{--c:#5df0a0}.pane[data-inst=pan]{--c:#35d6e0}
.phead{display:flex;gap:2px;padding:4px;background:#00000055;flex:none}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 4px;border:0;border-radius:10px;
  background:transparent;color:var(--mut);font-size:9.5px;font-weight:700;letter-spacing:.2px}
.tab svg{width:22px;height:22px}
.tab.on{background:var(--c);color:#0b1022}
.opts{flex:none;display:flex;gap:6px;padding:5px 6px;overflow-x:auto;align-items:center;touch-action:pan-x;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opts:empty{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 12px;background:#ffffff14;color:var(--ink);font-size:12px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--c);color:#0b1022}
.chip.lab{background:transparent;color:var(--mut);padding:7px 4px}
.stage{flex:1;min-height:0;position:relative;container-type:size;touch-action:none;overflow:hidden}

/* ---------- drums: SVG kit ---------- */
.drums{position:absolute;inset:0;overflow:hidden;background:#050508}
.kitsvg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none}
.kitsvg.l{display:none}
@container (min-aspect-ratio: 6/5){.kitsvg.p{display:none}.kitsvg.l{display:block}}
.dpd{transform-box:fill-box;transform-origin:center;transition:transform .07s,filter .1s}
.dpd.hit{filter:brightness(1.4) saturate(1.2);transform:scale(.965)}
.dpd text{pointer-events:none}

/* ---------- piano ---------- */
.piano{position:absolute;inset:0;display:flex;flex-direction:column-reverse;gap:12px;padding:10px 8px 8px;
  background:radial-gradient(120% 70% at 50% 0,#3b2a55,#150d22 62%,#07050c)}
.prow{position:relative;flex:1;min-height:0;--n:8;border-top:8px solid #8d1c2c;border-radius:6px 6px 12px 12px;
  background:#06060b;box-shadow:0 8px 16px #000b,0 -3px 0 #2b1d3a,inset 0 4px 6px #0008}
.prow::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;border-radius:6px 6px 0 0;pointer-events:none;
  background:linear-gradient(180deg,#ff6b80aa,transparent 55%);z-index:3}
.k{position:absolute;transition:filter .08s}
.k.w{top:0;height:100%;left:calc(var(--i)*100%/var(--n));width:calc(100%/var(--n));
  background:linear-gradient(90deg,#00000018,transparent 10%,transparent 88%,#0000001f),
             linear-gradient(180deg,#e2e6f4 0,#fff 7%,#fff 74%,#eef0fa 90%,#c4cae0 100%);
  border:1px solid #747ea3;border-top:0;border-radius:0 0 9px 9px;
  box-shadow:inset 0 -12px 10px -8px #0000002e,0 3px 4px #0009;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;color:#6a76ab;font-size:11px;font-weight:800}
.k.b{top:0;height:61%;left:calc(var(--i)*100%/var(--n) - 100%/var(--n)*.29);width:calc(100%/var(--n)*.58);z-index:2;
  background:linear-gradient(90deg,transparent 14%,#ffffff26 22%,transparent 36%),
             linear-gradient(180deg,#434a7a 0,#171b33 14%,#0a0c18 80%,#2c3258 100%);
  border-radius:0 0 7px 7px;box-shadow:0 8px 8px -2px #000d,inset 0 -9px 0 #1b1f3d,inset 0 1px 0 #7a82bd,inset 1px 0 0 #ffffff12}
.k.w.hit{background:linear-gradient(180deg,#fff 0,var(--c) 100%);box-shadow:inset 0 -6px 12px #0003}
.k.b.hit{background:linear-gradient(180deg,var(--c),#101a3c 90%);box-shadow:0 4px 4px #000a}
@container (min-aspect-ratio: 6/5){
  .piano{flex-direction:row;gap:0;align-items:center}
  .prow{height:100%;max-height:calc(100cqh - 18px);border-radius:6px 6px 12px 12px;box-shadow:0 8px 16px #000b,inset 0 4px 6px #0008}
  .prow:not(:last-child){--n:7;flex:7;border-radius:6px 0 0 12px}
  .prow:last-child{flex:8;border-radius:0 6px 12px 0}
  .prow:not(:last-child) .k.tc{display:none}
}

/* ---------- guitar ---------- */
.gtr,.fb{background:
  repeating-linear-gradient(0deg,#0000 0 3px,#00000022 3px 4px),
  repeating-linear-gradient(90deg,#0000 0 23px,#ffffff06 23px 24px),
  linear-gradient(180deg,#25120a,#4b2b18 50%,#25120a)}
.gtr{position:absolute;inset:0;display:flex;flex-direction:column;box-shadow:inset 0 10px 14px #0008,inset 0 -10px 14px #0008}
.gtr::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 30% 50%,#f4f0e0 0 8px,#0000 9px),radial-gradient(circle at 50% 50%,#f4f0e0 0 8px,#0000 9px),radial-gradient(circle at 70% 50%,#f4f0e0 0 8px,#0000 9px),
    repeating-linear-gradient(90deg,transparent 0 calc(20% - 5px),#fdfbf2 calc(20% - 5px) calc(20% - 3px),#8e8873 calc(20% - 3px) calc(20% - 1px),transparent calc(20% - 1px) 20%)}
.gtr::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;pointer-events:none;
  background:linear-gradient(90deg,#fffbe8,#cfc6a8 60%,#8e866c);box-shadow:2px 0 5px #000a}
.gs{flex:1;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 22px;color:#fff9;font-weight:800;font-size:12px}
.gs::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--th);transform:translateY(-50%);
  background:linear-gradient(180deg,#fffdf0 0,#e8dfbf 30%,#a89658 68%,#5a4a24 100%);box-shadow:0 4px 5px #000b,0 0 0 .5px #0007}
.gs.wound::before{background:repeating-linear-gradient(100deg,#00000038 0 2px,#ffffff2a 2px 4px),linear-gradient(180deg,#fff2c4 0,#d4a35a 30%,#8a5a22 68%,#3d2410 100%)}
.gs b{position:relative;z-index:1;background:linear-gradient(#2c3160,#12152c);border:1px solid #ffffff30;border-radius:9px;padding:2px 8px;color:#fff;box-shadow:0 2px 4px #000a}
.gs u{position:relative;z-index:1;text-decoration:none;color:#ffd990;text-shadow:0 1px 2px #000}
.gs.mute{opacity:.3}
.gs.hit{background:linear-gradient(#ffffff08,#ffd27a26,#ffffff08)}
.gs.vib::before{animation:gvib .55s ease-out}
@keyframes gvib{0%{transform:translateY(-50%) scaleY(1)}12%{transform:translateY(-50%) scaleY(2.8)}28%{transform:translateY(-50%) scaleY(.5)}
  46%{transform:translateY(-50%) scaleY(1.9)}66%{transform:translateY(-50%) scaleY(.8)}100%{transform:translateY(-50%) scaleY(1)}}
.fb{position:absolute;inset:0;display:grid;grid-template-columns:.7fr repeat(8,1fr);grid-template-rows:repeat(6,1fr);
  box-shadow:inset 0 10px 14px #0008,inset 0 -10px 14px #0008}
.fc{position:relative;border-right:3px solid #d9d4c2;box-shadow:2px 0 3px #0009;display:flex;align-items:flex-start;justify-content:flex-start}
.fc.nut{border-right:8px solid #f4eedb;background:#00000050}
.fc::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--th);transform:translateY(-50%);
  background:linear-gradient(180deg,#fffdf0 0,#e8dfbf 30%,#a89658 68%,#5a4a24 100%);box-shadow:0 3px 4px #000a}
.fc.wound::before{background:repeating-linear-gradient(100deg,#00000038 0 2px,#ffffff2a 2px 4px),linear-gradient(180deg,#fff2c4 0,#d4a35a 30%,#8a5a22 68%,#3d2410 100%)}
.fc.dot::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;z-index:2;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff,#d9d4bf 60%,#8e886f);box-shadow:0 1px 3px #000a}
.fc small{position:relative;z-index:1;color:#fff8;font-size:10px;font-weight:800;padding:2px 4px}
.fc.hit{background:#ffd27a40}

/* ---------- harp ---------- */
.harp{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 100%,#43296a,#170e2a 58%,#09060f)}
.neck{position:absolute;left:0;right:0;top:0;height:44%;pointer-events:none;
  background:linear-gradient(180deg,#ffffff38,transparent 30%,#0000004a 100%),
             repeating-linear-gradient(90deg,#0000 0 9px,#0000001c 9px 10px),
             linear-gradient(90deg,#4f2c14,#b97b43 28%,#8c5628 52%,#c68c52 76%,#4f2c14);
  clip-path:polygon(0 0,100% 0,100% 91%,0 9%);filter:drop-shadow(0 6px 6px #0009)}
.hbase{position:absolute;left:0;right:0;bottom:0;height:4%;pointer-events:none;
  background:linear-gradient(180deg,#e7b957 0 8%,#a86d3a 9%,#5a3418);box-shadow:0 -4px 8px #0008}
.hrow{position:absolute;inset:0;display:flex;padding:0 2%}
.hs{flex:1;position:relative;height:100%}
.hs::before{content:"";position:absolute;left:50%;top:calc(var(--top) - 2.4%);width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff8c8,#dcaa3c 55%,#6e4e10);box-shadow:0 2px 3px #000b;pointer-events:none;z-index:2}
.hl{position:absolute;left:50%;width:4px;margin-left:-2px;bottom:4%;top:var(--top);
  background:linear-gradient(90deg,var(--sc),#fff 50%,var(--sc));border-radius:2px;
  box-shadow:0 0 10px var(--sc),0 0 2px #fff8;pointer-events:none}
.hs.hit .hl{width:7px;margin-left:-3.5px;filter:brightness(1.4)}
.hs.vib .hl{animation:vib .5s ease-out}
@keyframes vib{0%{transform:translateX(0)}14%{transform:translateX(-5px)}30%{transform:translateX(5px)}48%{transform:translateX(-3px)}
  66%{transform:translateX(2px)}100%{transform:translateX(0)}}

/* ---------- xylophone ---------- */
.xylo{position:absolute;inset:0;display:flex;flex-direction:row;gap:1.6%;padding:4% 3%;align-items:center;
  background:radial-gradient(100% 80% at 50% 40%,#2d2050,#120b22)}
.xylo::before,.xylo::after{content:"";position:absolute;left:2%;right:2%;height:3.2%;border-radius:8px;pointer-events:none;
  background:linear-gradient(180deg,#d7995a,#8a5428 45%,#4a2a12);box-shadow:0 5px 8px #000b,inset 0 1px 0 #ffffff55}
.xylo::before{top:24%}.xylo::after{bottom:24%}
.xb{position:relative;z-index:1;flex:1;height:calc(var(--len)*1%);border-radius:13px;
  background:linear-gradient(180deg,#ffffff70 0,#ffffff00 22%),linear-gradient(90deg,#00000030,transparent 22%,transparent 78%,#00000040),hsl(var(--h) 82% 55%);
  box-shadow:inset 0 2px 0 #ffffff80,inset 0 -7px 10px #0000004d,0 7px 10px #000a;display:flex;align-items:center;justify-content:center;
  color:#0b1022cc;font-weight:900;font-size:clamp(10px,2.6cqmin,15px);transition:transform .07s,filter .12s}
.xb::before,.xb::after{content:"";position:absolute;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#555,#000);box-shadow:0 1px 0 #ffffff55}
.xb::before{top:12%}.xb::after{bottom:12%}
.xb.hit{filter:brightness(1.45);transform:scale(.965)}
@container (max-aspect-ratio: 1/1){
  .xylo{flex-direction:column-reverse;padding:3% 4%;gap:1.4%}
  .xylo::before,.xylo::after{top:2%;bottom:2%;width:3.2%;height:auto}
  .xylo::before{left:24%;right:auto}.xylo::after{right:24%;left:auto}
  .xb{height:auto;width:calc(var(--len)*1%)}
  .xb::before,.xb::after{left:auto;margin-left:0;top:50%;margin-top:-4.5px}
  .xb::before{left:8%}.xb::after{right:8%;bottom:auto}
}

/* ---------- steel pan ---------- */
.pan{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 45%,#14414d,#081820 70%,#040c10)}
.pw{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh);border-radius:50%;
  background:conic-gradient(from 30deg,#e4ebf3,#6a7782,#f3f7fb,#56626d,#e4ebf3);
  box-shadow:0 14px 28px #000c,inset 0 0 0 2px #ffffff55}
.pw::before{content:"";position:absolute;inset:3.4%;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#8fa0b0,#3b4752 58%,#1c242c);
  box-shadow:inset 0 8px 16px #000b,inset 0 -3px 6px #ffffff2a}
.pp{position:absolute;border-radius:50%;width:calc(var(--d)*1%);height:calc(var(--d)*1%);
  left:calc(var(--x)*1% - var(--d)*.5%);top:calc(var(--y)*1% - var(--d)*.5%);
  background:radial-gradient(circle at 34% 26%,#ffffffcc,#ffffff00 40%),
             conic-gradient(from 200deg,#ffffff30,transparent 30%,#00000030 55%,transparent 80%,#ffffff30),hsl(var(--h) 70% 50%);
  box-shadow:0 0 0 2px #000a,0 0 0 3.5px #ffffff22,inset 0 -6px 10px #0000006e,inset 0 3px 4px #ffffff66,0 4px 6px #0009;
  display:flex;align-items:center;justify-content:center;
  color:#0b1022d0;font-weight:900;font-size:clamp(10px,3cqmin,17px);text-shadow:0 1px 0 #ffffff55;transition:transform .07s,filter .12s}
.pp.hit{filter:brightness(1.5);transform:scale(.93)}

/* ---------- controls ---------- */
#layers{display:flex;gap:6px;flex-wrap:wrap}
#layers:empty{display:none}
.lay{display:flex;align-items:center;gap:4px;border:0;border-radius:999px;padding:4px 4px 4px 8px;background:#ffffff1c;color:var(--ink);font-size:11px;font-weight:800}
.lay svg{width:16px;height:16px}
.lay.mute{opacity:.4}
.lay.rec{background:var(--rec)}
.lay s{text-decoration:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#0006;font-size:13px}
#status{position:relative;min-height:26px;border-radius:9px;background:#00000055;overflow:hidden;display:flex;align-items:center;padding:0 10px}
#stxt{position:relative;z-index:1;font-size:11.5px;font-weight:700;color:#dfe6ff;line-height:1.2;padding:5px 0}
#prog{position:absolute;left:0;top:0;bottom:0;width:0;background:#4f7cff55}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{flex:1 1 0;min-width:40px;height:46px;border:0;border-radius:14px;background:#ffffff16;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:800;letter-spacing:.2px}
.btn svg{width:20px;height:20px}
.btn:active{filter:brightness(1.3)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.on{background:#fff;color:#0b1022}
#bRec{color:#ff6f7f}
#bRec.on{background:var(--rec);color:#fff;animation:pulse 1s infinite}
#bRec.arm{background:#ffb23e;color:#0b1022;animation:pulse .5s infinite}
@keyframes pulse{50%{filter:brightness(1.35)}}
#bBeat.pulse svg{transform:scale(1.25);transition:none}
#bBeat svg{transition:transform .12s}
.bpm{flex:1.8 1 0;min-width:116px;height:46px;display:flex;align-items:center;border-radius:14px;background:#ffffff16;overflow:hidden}
.bpm>button{width:34px;height:100%;border:0;background:transparent;font-size:20px;font-weight:800}
.bpm>.tapc{width:auto;flex:1;min-width:0;font-size:inherit;font-weight:inherit;line-height:1.05;padding:0}
.bpm button[disabled]{opacity:.25;pointer-events:none}
.bpm b{display:block;font-size:16px}
.bpm small{display:block;font-size:8.5px;color:var(--mut);font-weight:800;letter-spacing:.3px;white-space:nowrap}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;text-align:center;background:radial-gradient(120% 90% at 50% 20%,#27337a,#0a0f1f 70%);cursor:pointer}
#splash h1{margin:0;font-size:clamp(40px,12vmin,84px);letter-spacing:2px;font-weight:900;
  background:linear-gradient(90deg,#ff7a59,#ffb23e,#5df0a0,#35d6e0,#c58bff);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash p{margin:0;max-width:30em;color:#c9d2ff;font-size:clamp(13px,3.6vmin,18px);line-height:1.45}
#splash .go{margin-top:8px;padding:14px 34px;border-radius:999px;background:#fff;color:#0b1022;font-weight:900;font-size:18px;animation:pulse 1.4s infinite}
#splash.hide{display:none}

/* ---------- extra row, sheets, sliders, toast ---------- */
.row.mini .btn{height:38px;flex-direction:row;gap:6px;font-size:11px;border-radius:12px}
.row.mini .btn svg{width:17px;height:17px}
#sheet{--c:#6ab0ff;position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:#000a;padding:var(--sat) var(--sar) 0 var(--sal)}
#sheet.show{display:flex}
#sheetBox{width:min(560px,100%);max-height:88%;display:flex;flex-direction:column;background:#141c3d;border-radius:20px 20px 0 0;
  border:1px solid #ffffff1c;box-shadow:0 -10px 40px #000a;padding-bottom:var(--sab)}
@media (orientation:landscape){#sheet{align-items:center}#sheetBox{border-radius:20px;max-height:94%;padding-bottom:0}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;font-weight:900;font-size:16px;flex:none}
.sh-x{width:34px;height:34px;border:0;border-radius:50%;background:#ffffff1c;font-size:20px;line-height:1}
.sh-body{overflow-y:auto;touch-action:pan-y;padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.sh-card{background:#ffffff0e;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sh-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-title{font-weight:800;font-size:13px}
.sh-sub{font-size:11.5px;color:var(--mut);font-weight:600}
.sbtn{border:0;border-radius:10px;padding:9px 13px;background:#ffffff1c;color:var(--ink);font-size:12.5px;font-weight:800}
.sbtn.pri{background:#fff;color:#0b1022}
.sbtn.red{background:#ff3b4f33;color:#ff8f9b}
.sbtn[disabled]{opacity:.35;pointer-events:none}
.sh-in{flex:1;min-width:0;border:1px solid #ffffff2a;border-radius:10px;background:#0006;color:var(--ink);padding:9px 10px;
  font:700 14px system-ui;user-select:text;-webkit-user-select:text;touch-action:auto}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:28px;background:transparent;touch-action:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#ffffff2a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 2px 6px #0008}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#ffffff2a}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff}
.sh-lab{width:64px;font-size:12px;font-weight:800;flex:none}
.sh-val{width:42px;text-align:right;font-size:11px;color:var(--mut);font-weight:800;flex:none}

  padding:10px 16px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:0 6px 24px #000a;pointer-events:none;display:none;max-width:90%;text-align:center}

#learn.show{display:flex}
.lh{display:flex;align-items:center;gap:10px;padding:8px 10px;flex:none}

<div id="splash">
  <h1>POCKET BAND</h1>
  <p>Drums &middot; Piano &middot; Guitar &middot; Harp &middot; Xylophone &middot; Steel Pan</p>
  <p>Tap to play. Swipe across the harp, guitar strings, piano and xylophone. Hit <b>Rec</b> to loop what you play, then hit it again to layer more on top.</p>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const freq=m=>440*Math.pow(2,(m-69)/12);
const NN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

/* =====================================================================
   AUDIO ENGINE  (everything is synthesized, no sample files)
   ===================================================================== */
const AU={
  ctx:null,dry:null,wet:null,beat:null,noiseBuf:null,ks:{},
  init(){
    if(this.ctx)return;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    this.ctx=new C({latencyHint:'interactive'});this.setup(this.ctx);
  },
  setup(c){
    const master=c.createGain();master.gain.value=0.9;
    const comp=c.createDynamicsCompressor();
    comp.threshold.value=-16;comp.knee.value=14;comp.ratio.value=5;comp.attack.value=0.004;comp.release.value=0.22;
    master.connect(comp);comp.connect(c.destination);
    this.dry=c.createGain();this.dry.connect(master);
    const conv=c.createConvolver();conv.buffer=this.ir(1.7);
    this.wet=c.createGain();this.wet.connect(conv);
    const wg=c.createGain();wg.gain.value=S.rev;conv.connect(wg);wg.connect(master);this.rev=wg;
    this.beat=c.createGain();this.beat.gain.value=S.beatVol;this.beat.connect(master);
    const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    this.noiseBuf=nb;
  },
  wake(){
    this.init();const c=this.ctx;if(!c)return;
    if(c.state!=='running'){try{c.resume().catch(()=>{});}catch(e){}}
    if(!this._unl){this._unl=1;try{const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);}catch(e){}}
  },
  ir(sec){
    const c=this.ctx,n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);}
    return b;
  },
  send(node,amt,bus){
    node.connect(bus||this.dry);
    if(amt>0){const s=this.ctx.createGain();s.gain.value=amt;node.connect(s);s.connect(this.wet);}
  },
  noise(when,dur){
    const s=this.ctx.createBufferSource();s.buffer=this.noiseBuf;
    s.start(when,Math.random()*Math.max(0,2-dur-0.01),dur);return s;
  },
  env(g,t,a,peak,dec){
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);
  },
  metal(when,v,dec,hp,bp,gain,bus){
    const c=this.ctx,mix=c.createGain();
    [205.3,304.4,369.6,522.7,540,800].forEach(f=>{
      const o=c.createOscillator();o.type='square';o.frequency.value=f;o.connect(mix);o.start(when);o.stop(when+dec+0.06);
    });
    const b=c.createBiquadFilter();b.type='bandpass';b.frequency.value=bp;b.Q.value=0.7;
    const h=c.createBiquadFilter();h.type='highpass';h.frequency.value=hp;
    this.env(mix,when,0.002,gain*v,dec);
    mix.connect(b);b.connect(h);h.connect(bus);
  },
  drum(id,when,vel,bus){
    const c=this.ctx;bus=bus||this.dry;const v=vel,E=(g,t,a,p,d)=>this.env(g,t,a,p,d);
    if(id==='kick'){
      const o=c.createOscillator(),g=c.createGain();o.type='sine';
      o.frequency.setValueAtTime(170,when);o.frequency.exponentialRampToValueAtTime(46,when+0.13);
      E(g,when,0.003,1.0*v,0.5);o.connect(g);g.connect(bus);o.start(when);o.stop(when+0.6);
      const n=this.noise(when,0.02),f=c.createBiquadFilter(),ng=c.createGain();
      f.type='lowpass';f.frequency.value=2500;E(ng,when,0.001,0.3*v,0.015);n.connect(f);f.connect(ng);ng.connect(bus);
    }else if(id==='snare'){
      const n=this.noise(when,0.3),f=c.createBiquadFilter(),g=c.createGain();
      f.type='highpass';f.frequency.value=1700;E(g,when,0.001,0.75*v,0.2);n.connect(f);f.connect(g);g.connect(bus);
      const o=c.createOscillator(),og=c.createGain();o.type='triangle';
      o.frequency.setValueAtTime(220,when);o.frequency.exponentialRampToValueAtTime(130,when+0.08);
      E(og,when,0.001,0.55*v,0.12);o.connect(og);og.connect(bus);o.start(when);o.stop(when+0.2);
    }else if(id==='tom1'||id==='tom2'||id==='floor'){
      const f0={tom1:200,tom2:150,floor:105}[id];
      const o=c.createOscillator(),g=c.createGain();o.type='sine';
      o.frequency.setValueAtTime(f0*1.7,when);o.frequency.exponentialRampToValueAtTime(f0,when+0.09);
      E(g,when,0.002,0.95*v,id==='floor'?0.6:0.45);o.connect(g);g.connect(bus);o.start(when);o.stop(when+0.75);
      const n=this.noise(when,0.02),f=c.createBiquadFilter(),ng=c.createGain();
      f.type='lowpass';f.frequency.value=2200;E(ng,when,0.001,0.25*v,0.015);n.connect(f);f.connect(ng);ng.connect(bus);
    }else if(id==='hat'){this.metal(when,v,0.06,7000,10000,0.32,bus);
    }else if(id==='openhat'){this.metal(when,v,0.4,7000,10000,0.3,bus);
    }else if(id==='ride'){this.metal(when,v,1.1,4500,7500,0.22,bus);
    }else if(id==='crash'){
      this.metal(when,v,1.9,3200,6500,0.3,bus);
      const n=this.noise(when,1.4),f=c.createBiquadFilter(),g=c.createGain();
      f.type='highpass';f.frequency.value=3000;E(g,when,0.002,0.22*v,1.3);n.connect(f);f.connect(g);g.connect(bus);
    }else if(id==='clap'){
      [0,0.012,0.024].forEach(dt=>{
        const n=this.noise(when+dt,0.05),f=c.createBiquadFilter(),g=c.createGain();
        f.type='bandpass';f.frequency.value=1300;f.Q.value=1.3;E(g,when+dt,0.001,0.7*v,0.012);n.connect(f);f.connect(g);g.connect(bus);
      });
      const n=this.noise(when+0.03,0.25),f=c.createBiquadFilter(),g=c.createGain();
      f.type='bandpass';f.frequency.value=1300;f.Q.value=1.1;E(g,when+0.03,0.002,0.6*v,0.16);n.connect(f);f.connect(g);g.connect(bus);
    }else if(id==='rim'){
      const o=c.createOscillator(),og=c.createGain();o.type='triangle';
      o.frequency.setValueAtTime(520,when);o.frequency.exponentialRampToValueAtTime(330,when+0.05);
      E(og,when,0.001,0.6*v,0.07);o.connect(og);og.connect(bus);o.start(when);o.stop(when+0.1);
      const n=this.noise(when,0.06),f=c.createBiquadFilter(),g=c.createGain();
      f.type='bandpass';f.frequency.value=2400;f.Q.value=0.9;E(g,when,0.001,0.8*v,0.035);n.connect(f);f.connect(g);g.connect(bus);
      const o2=c.createOscillator(),g2=c.createGain();o2.type='sine';o2.frequency.setValueAtTime(190,when);
      E(g2,when,0.001,0.5*v,0.11);o2.connect(g2);g2.connect(bus);o2.start(when);o2.stop(when+0.15);
    }else if(id==='click'||id==='click2'){
      const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=id==='click2'?1650:1100;
      E(g,when,0.001,0.7*v,0.05);o.connect(g);g.connect(bus);o.start(when);o.stop(when+0.08);
    }
  },
  ksBuf(key,f,secs,damp,smooth){
    if(this.ks[key])return this.ks[key];
    const c=this.ctx,sr=c.sampleRate,N=Math.max(3,Math.round(sr/f+0.5)),len=Math.floor(sr*secs);
    const buf=c.createBuffer(1,len,sr),d=buf.getChannelData(0),line=new Float32Array(N);
    for(let i=0;i<N;i++)line[i]=Math.random()*2-1;
    for(let p=0;p<smooth;p++){let prev=line[N-1];for(let i=0;i<N;i++){const cur=line[i];line[i]=(cur+prev)*0.5;prev=cur;}}
    let mx=0;for(let i=0;i<N;i++)mx=Math.max(mx,Math.abs(line[i]));
    const sc=0.95/(mx||1);for(let i=0;i<N;i++)line[i]*=sc;
    let idx=0;
    for(let i=0;i<len;i++){const a=line[idx],b=line[(idx+1)%N];d[i]=a;line[idx]=(a+b)*0.5*damp;idx=(idx+1)%N;}
    const fade=Math.min(4000,len>>2);for(let i=0;i<fade;i++)d[len-1-i]*=i/fade;
    return this.ks[key]={buf,rate:f*(N-0.5)/sr};
  },
  pluck(key,f,when,vel,o){
    const k=this.ksBuf(key,f,o.secs,o.damp,o.smooth),c=this.ctx;
    const s=c.createBufferSource();s.buffer=k.buf;s.playbackRate.value=k.rate;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=o.lp;
    const g=c.createGain();g.gain.value=o.gain*vel;
    s.connect(lp);lp.connect(g);this.send(g,o.send);s.start(when);
  },
  piano(m,when,vel){
    const c=this.ctx,f=freq(m),out=c.createGain();out.gain.value=0.4*vel;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(9000,f*(3+vel*7)+800);
    out.connect(lp);this.send(lp,0.18);
    const dur=Math.max(1.1,3.6-(m-36)*0.035);
    [[1,1],[2,0.45],[3,0.24],[4,0.13],[5,0.07],[6,0.04]].forEach(([k,a])=>{
      const ff=f*k*(1+0.00015*k*k);if(ff>14000)return;
      const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=ff;
      const d=dur/(1+0.55*(k-1));this.env(g,when,0.004,a,d);o.connect(g);g.connect(out);o.start(when);o.stop(when+d+0.06);
    });
    const o2=c.createOscillator(),g2=c.createGain();o2.type='triangle';o2.frequency.value=f*1.0018;
    this.env(g2,when,0.004,0.25,dur*0.6);o2.connect(g2);g2.connect(out);o2.start(when);o2.stop(when+dur*0.6+0.06);
    const n=this.noise(when,0.03),nf=c.createBiquadFilter(),ng=c.createGain();
    nf.type='bandpass';nf.frequency.value=Math.min(4000,f*3);nf.Q.value=0.8;this.env(ng,when,0.001,0.25,0.03);
    n.connect(nf);nf.connect(ng);ng.connect(out);
  },
  xylo(m,when,vel){
    const c=this.ctx,f=freq(m),out=c.createGain();out.gain.value=0.5*vel;this.send(out,0.22);
    const base=Math.max(0.45,Math.min(1.5,1.7-(m-60)*0.028));
    [[1,1,base],[3,0.38,base*0.35],[6,0.14,base*0.16]].forEach(([k,a,d])=>{
      const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*k;
      this.env(g,when,0.002,a,d);o.connect(g);g.connect(out);o.start(when);o.stop(when+d+0.06);
    });
    const n=this.noise(when,0.012),nf=c.createBiquadFilter(),ng=c.createGain();
    nf.type='highpass';nf.frequency.value=3500;this.env(ng,when,0.001,0.22,0.01);n.connect(nf);nf.connect(ng);ng.connect(out);
  },
  pan(m,when,vel){
    const c=this.ctx,f=freq(m),out=c.createGain();out.gain.value=0.5*vel;this.send(out,0.3);
    [[1,1,1.7],[2,0.5,1.1],[3,0.18,0.6]].forEach(([k,a,d])=>{
      [0,1].forEach(j=>{
        if(j&&k>1)return;
        const o=c.createOscillator(),g=c.createGain();o.type='sine';
        const ff=f*k+(j?1.3:0);o.frequency.setValueAtTime(ff*1.02,when);o.frequency.setTargetAtTime(ff,when,0.012);
        this.env(g,when,0.004,a*(j?0.6:1),d);o.connect(g);g.connect(out);o.start(when);o.stop(when+d+0.06);
      });
    });
  },
  play(inst,id,when,vel,bus){
    if(!this.ctx)return;
    if(inst==='drums'){this.drum(id,when,vel,bus);return;}
    const m=+id;
    if(inst==='piano')this.piano(m,when,vel);
    else if(inst==='guitar')this.pluck('g'+m,freq(m),when,vel,{secs:3.2,damp:0.9962,smooth:1,lp:5200,send:0.12,gain:0.8});
    else if(inst==='harp')this.pluck('h'+m,freq(m),when,vel,{secs:3.6,damp:0.9983,smooth:4,lp:6500,send:0.32,gain:0.9});
    else if(inst==='xylo')this.xylo(m,when,vel);
    else if(inst==='pan')this.pan(m,when,vel);
  }
};

/* =====================================================================
   BACKING BEATS (16 steps = one 4/4 bar)
   ===================================================================== */
function pat(f,len){const a=Array.from({length:len||16},()=>[]);f((s,id,v=0.8)=>a[s].push([id,v]));return a;}
const PATS={
  rock:{name:'Rock',bpm:110,steps:pat(p=>{[0,8,10].forEach(s=>p(s,'kick'));[4,12].forEach(s=>p(s,'snare'));for(let s=0;s<16;s+=2)p(s,'hat',s%4?0.5:0.75);})},
  pop:{name:'Pop',bpm:118,steps:pat(p=>{[0,4,8,12].forEach(s=>p(s,'kick'));[4,12].forEach(s=>p(s,'clap'));[2,6,10,14].forEach(s=>p(s,'openhat',0.55));})},
  hip:{name:'Hip-Hop',bpm:90,steps:pat(p=>{[0,7,10].forEach(s=>p(s,'kick'));[4,12].forEach(s=>p(s,'snare'));for(let s=0;s<16;s+=2)p(s,'hat',s%4?0.45:0.7);})},
  funk:{name:'Funk',bpm:100,steps:pat(p=>{[0,3,6,10,13].forEach(s=>p(s,'kick'));[4,12].forEach(s=>p(s,'snare'));[7,15].forEach(s=>p(s,'snare',0.3));for(let s=0;s<16;s++)p(s,'hat',s%2?0.35:0.6);})},
  reggae:{name:'Reggae',bpm:80,steps:pat(p=>{p(8,'kick');p(8,'snare');for(let s=0;s<16;s+=2)p(s,'hat',s%4?0.5:0.7);})},

const CHORDS={E:[0,2,2,1,0,0],Em:[0,2,2,0,0,0],A:[-1,0,2,2,2,0],Am:[-1,0,2,2,1,0],D:[-1,-1,0,2,3,2],Dm:[-1,-1,0,2,3,1],

BUILD.guitar=(st,op,pane,remount)=>{
  const o=pane.o.guitar||(pane.o.guitar={mode:'chords',chord:'G'});

    let h='<div class="fb">';
    for(let r=0;r<6;r++)for(let f=0;f<=8;f++)h+=`<div class="fc${f===0?' nut':''}${r<3?' wound':''}${r===2&&(f===3||f===5||f===7)?' dot':''}" data-pad="${GBASE[r]+f}" style="--th:${GTH[r]}px">${r===0?`<small>${f}</small>`:''}</div>`;
    st.innerHTML=h+'</div>';
  }else{
    const fr=CHORDS[o.chord];let h='<div class="gtr">';
    for(let r=0;r<6;r++){
      const f=fr[r];
      h+=`<div class="gs${f<0?' mute':''}${r<3?' wound':''}"${f<0?'':` data-pad="${GBASE[r]+f}"`} style="--th:${GTH[r]}px"><u>${NAME(GBASE[r])}</u><b>${f<0?'×':f}</b></div>`;
    }
    st.innerHTML=h+'</div>';
  }
  op.append(chip('Chords',o.mode!=='frets',()=>{o.mode='chords';remount();}),
            chip('Frets',o.mode==='frets',()=>{o.mode='frets';remount();}));
  if(o.mode!=='frets')Object.keys(CHORDS).forEach(k=>op.append(chip(k,o.chord===k,()=>{o.chord=k;remount();})));
};

BUILD.harp=(st,op,pane,remount)=>{
  const o=pane.o.harp||(pane.o.harp={scale:'pent'});
  const notes=[];
  if(o.scale==='major'){for(let m=48;m<=84;m++)if([0,2,4,5,7,9,11].includes(m%12))notes.push(m);}
  else{for(let m=48;m<=84;m++)if([0,2,4,7,9].includes(m%12))notes.push(m);}
  const n=notes.length;
  let h='<div class="harp"><div class="neck"></div><div class="hbase"></div><div class="hrow">';
  notes.forEach((m,i)=>{
    const pc=m%12,col=pc===0?'#ff5470':pc===5?'#4da3ff':'#f6e7c6';
    const top=4+((i+0.5)/n)*36;
    h+=`<div class="hs" data-pad="${m}" style="--sc:${col};--top:${top.toFixed(1)}%"><div class="hl"></div></div>`;
  });

  op.append(chip('Pentatonic',o.scale!=='major',()=>{o.scale='pent';remount();}),
            chip('Full scale',o.scale==='major',()=>{o.scale='major';remount();}));

function flash(e){
  e.classList.add('hit');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('hit'),140);
  if(e.classList.contains('hs')||e.classList.contains('gs')){
    e.classList.remove('vib');void e.offsetWidth;e.classList.add('vib');clearTimeout(e._v);e._v=setTimeout(()=>e.classList.remove('vib'),700);
  }
}
function flashNote(inst,id){document.querySelectorAll(`.stage[data-inst="${inst}"] [data-pad="${id}"]`).forEach(flash);}
function recEvent(inst,id,vel){
  if(!AU.ctx)return;const now=AU.ctx.currentTime;
  if(T.state==='rec1'&&T.pending){
    if(now<T.t0)return;
    T.pending.events.push({t:now-T.t0,i:inst,n:id,v:vel,abs:now});
  }else if(T.state==='over'&&T.cur&&T.loopLen){
    const L=T.loopLen,ph=(((now-T.t0)%L)+L)%L;
    T.cur.events.push({t:ph,i:inst,n:id,v:vel,abs:now});
  }
}
function hit(inst,id,vel){
  if(!AU.ctx)return;
  AU.play(inst,id,AU.ctx.currentTime,vel);
  recEvent(inst,id,vel);
}
function trigger(e){
  const st=e.closest('.stage');if(!st)return;
  hit(st.dataset.inst,e.dataset.pad,0.74+Math.random()*0.22);flash(e);buzz(st.dataset.inst==='drums'?14:8);
}

function attachInput(stage){
  const act=new Map();
  const padAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest('[data-pad]'):null;};
  stage.addEventListener('pointerdown',e=>{
    e.preventDefault();AU.wake();
    const p=padAt(e.clientX,e.clientY);
    act.set(e.pointerId,{x:e.clientX,y:e.clientY,el:p});
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
    if(p)trigger(p);
  });
  stage.addEventListener('pointermove',e=>{
    const a=act.get(e.pointerId);if(!a)return;
    const dx=e.clientX-a.x,dy=e.clientY-a.y,steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/6));
    for(let s=1;s<=steps;s++){
      const p=padAt(a.x+dx*s/steps,a.y+dy*s/steps);
      if(p!==a.el){a.el=p;if(p)trigger(p);}
    }
    a.x=e.clientX;a.y=e.clientY;
  });
  const end=e=>{act.delete(e.pointerId);};
  stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);stage.addEventListener('lostpointercapture',end);
}

/* =====================================================================
   BEAT + LOOPER TRANSPORT
   ===================================================================== */
const beatBtn=$('#bBeat');
function startBeat(at){
  const now=AU.ctx.currentTime;T.beatOn=true;let t=at;
  if(t==null){
    if(T.looping&&T.aligned&&T.loopLen){const k=Math.ceil((now+0.05-T.t0)/T.loopLen);t=T.t0+k*T.loopLen;}
    else t=now+0.08;
  }
  T.beatT0=t;T.stepIdx=0;
}
function beatStep(step,time){
  const P=PATS[T.pat];
  P.steps[step].forEach(([id,v])=>AU.drum(id,time,v*0.9,AU.beat));
  if(step%4===0){
    setTimeout(()=>{beatBtn.classList.add('pulse');setTimeout(()=>beatBtn.classList.remove('pulse'),90);},Math.max(0,(time-AU.ctx.currentTime)*1000));
  }
}
function scheduleLoop(from,to){
  const L=T.loopLen;if(!L)return;
  const k0=Math.max(0,Math.floor((from-T.t0)/L)),k1=Math.floor((to-T.t0)/L);
  const now=AU.ctx.currentTime;
  for(let k=k0;k<=k1;k++){
    const base=T.t0+k*L;
    for(const lay of T.layers){
      if(lay.muted)continue;
      for(const ev of lay.events){
        const at=base+ev.t;
        if(at>=from&&at<to&&at>ev.abs+0.01){
          AU.play(ev.i,ev.n,at,Math.min(1.2,ev.v*(lay.vol==null?1:lay.vol)));
          setTimeout(()=>flashNote(ev.i,ev.n),Math.max(0,(at-now)*1000));
        }
      }
    }
  }
}
function tick(){
  if(!AU.ctx||AU.ctx.state!=='running')return;
  const now=AU.ctx.currentTime,hz=now+0.14;
  if(T.beatOn){
    const sd=stepDur();
    if(T.beatT0+T.stepIdx*sd<now-0.25)T.stepIdx=Math.max(0,Math.ceil((now-T.beatT0)/sd));
    while(stepTime(T.stepIdx)<hz){beatStep(T.stepIdx%patLen(),stepTime(T.stepIdx));T.stepIdx++;}
  }
  if(T.looping&&T.loopLen){
    if(T.schedFrom<now-0.3)T.schedFrom=now;
    scheduleLoop(T.schedFrom,hz);T.schedFrom=hz;
  }
}
const newLayer=()=>({id:T.nextId++,events:[],muted:false,rec:false,vol:1});
function resetLoop(){T.layers=[];T.loopLen=0;T.looping=false;T.state='idle';T.cur=null;T.pending=null;T.aligned=false;T.wantBeat=false;}
function finishFirst(){
  const now=AU.ctx.currentTime;
  if(now<T.t0||!T.pending||!T.pending.events.length){T.pending=null;T.state='idle';return;}
  const E=now-T.t0;let L;
  if(T.aligned)L=Math.max(1,Math.round(E/barLen()))*barLen();else L=Math.max(0.6,E);
  const lay=T.pending;lay.events.forEach(ev=>{ev.t=ev.t%L;});
  T.loopLen=L;T.layers=[lay];T.pending=null;T.state='loop';T.looping=true;T.schedFrom=now;
}
function finishOver(){
  if(T.cur){T.cur.rec=false;if(!T.cur.events.length)T.layers=T.layers.filter(l=>l!==T.cur);}
  T.cur=null;T.state='loop';if(!T.layers.length)resetLoop();
}
function playLoop(){
  const now=AU.ctx.currentTime;T.t0=now+0.06;T.schedFrom=T.t0;T.looping=true;
  if(T.wantBeat&&T.aligned){T.wantBeat=false;startBeat(T.t0);}else if(T.beatOn&&T.aligned)startBeat(T.t0);
}
function onRec(){
  AU.wake();if(!AU.ctx)return;const now=AU.ctx.currentTime;
  if(T.state==='idle'){
    let t0=now+0.02;T.aligned=false;
    if(T.beatOn){const bar=barLen(),n=Math.ceil((now+0.3-T.beatT0)/bar);t0=T.beatT0+Math.max(0,n)*bar;T.aligned=true;}
    T.t0=t0;T.pending=newLayer();T.state='rec1';
  }else if(T.state==='rec1'){finishFirst();}
  else if(T.state==='loop'){
    if(!T.looping)playLoop();
    T.cur=newLayer();T.cur.rec=true;T.layers.push(T.cur);T.state='over';
  }else if(T.state==='over'){finishOver();}
  renderLayers();updateBtns();
}
function onPlay(){
  AU.wake();if(!AU.ctx)return;
  if(T.state==='rec1')finishFirst();else if(T.state==='over')finishOver();
  if(T.looping)T.looping=false;else if(T.layers.length)playLoop();
  renderLayers();updateBtns();
}
function onUndo(){
  if(T.state==='rec1'){T.pending=null;T.state='idle';}
  else if(T.state==='over'){T.layers=T.layers.filter(l=>l!==T.cur);T.cur=null;T.state='loop';}
  else T.layers.pop();
  if(!T.layers.length&&T.state!=='rec1')resetLoop();
  renderLayers();updateBtns();
}
function onClear(){resetLoop();renderLayers();updateBtns();}
function mainInst(L){
  const c={};L.events.forEach(e=>c[e.i]=(c[e.i]||0)+1);
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'drums';
}
const layersEl=$('#layers');
function renderLayers(){
  layersEl.innerHTML='';
  T.layers.forEach((L,idx)=>{
    const b=el('button','lay'+(L.muted?' mute':'')+(L.rec?' rec':''),`${ICON[mainInst(L)]}<span>${idx+1}</span>`);
    const x=el('s','','×');
    x.addEventListener('click',ev=>{
      ev.stopPropagation();
      if(L===T.cur){T.cur=null;T.state='loop';}
      T.layers=T.layers.filter(l=>l!==L);
      if(!T.layers.length)resetLoop();
      renderLayers();updateBtns();
    });
    b.addEventListener('click',()=>{L.muted=!L.muted;renderLayers();});
    b.appendChild(x);layersEl.appendChild(b);
  });
  saveDraft();
}
const bRec=$('#bRec'),bPlay=$('#bPlay'),bUndo=$('#bUndo'),bClear=$('#bClear'),bpmM=$('#bpmM'),bpmP=$('#bpmP');
function updateBtns(){
  const rec=T.state==='rec1'||T.state==='over';
  bRec.classList.toggle('on',rec&&AU.ctx&&(T.state==='over'||AU.ctx.currentTime>=T.t0));

}

$('#bPat').addEventListener('click',()=>{

function holdRepeat(btn,fn){

/* status text + loop progress */
const stxt=$('#stxt'),prog=$('#prog');let lastTxt='',lastW='';
function frame(){
  if(AU.ctx){
    const now=AU.ctx.currentTime;let txt,w=0;
    const beatsLeft=()=>Math.max(1,Math.ceil((T.t0-now)/(60/T.bpm)));
    if(T.state==='rec1'){
      if(now<T.t0)txt='Get ready… '+beatsLeft();
      else{txt='Recording… '+(now-T.t0).toFixed(1)+'s  ·  tap Rec to loop it';if(T.aligned)w=((now-T.t0)%barLen())/barLen()*100;}
    }else if(T.state==='over'){txt='Layering… tap Rec to finish';w=T.looping&&T.loopLen?(((now-T.t0)%T.loopLen+T.loopLen)%T.loopLen)/T.loopLen*100:0;}
    else if(T.state==='loop'){
      txt=T.looping?'Looping · '+T.layers.length+(T.layers.length>1?' layers':' layer')+' · tap Rec to add more':'Loop stopped · tap Play';
      if(T.looping&&T.loopLen)w=(((now-T.t0)%T.loopLen+T.loopLen)%T.loopLen)/T.loopLen*100;
    }else txt=T.beatOn?'Beat on · Rec waits for the next bar':'Pick an instrument and play · Rec to loop';
    const ws=w.toFixed(1)+'%';
    if(txt!==lastTxt){stxt.textContent=txt;lastTxt=txt;}
    if(ws!==lastW){prog.style.width=ws;lastW=ws;}
    if(T.state==='rec1')updateBtns();
  }
  requestAnimationFrame(frame);
}

let taps=[];

const SONGKEY='tapband.songs.v1',DRAFTKEY='tapband.draft.v1';
function getSongs(){try{const a=JSON.parse(localStorage.getItem(SONGKEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function putSongs(a){try{localStorage.setItem(SONGKEY,JSON.stringify(a));return true;}catch(e){return false;}}
function snapshot(){
  const layers=T.layers.filter(l=>!l.rec&&l.events.length).map(l=>({muted:!!l.muted,vol:l.vol==null?1:l.vol,
    events:l.events.map(e=>({t:+e.t.toFixed(4),i:e.i,n:e.n,v:+e.v.toFixed(2)}))}));
  return {loopLen:T.loopLen,bpm:T.bpm,pat:T.pat,beat:!!(T.beatOn&&T.aligned),swing:S.swing,aligned:T.aligned,layers};
}
function saveDraft(){
  try{const sn=snapshot();if(sn.layers.length&&T.loopLen)localStorage.setItem(DRAFTKEY,JSON.stringify(sn));else localStorage.removeItem(DRAFTKEY);}catch(e){}
}
function loadSnap(sn,autoplay){
  stopTransport();resetLoop();
  T.bpm=sn.bpm;S.bpm=sn.bpm;T.pat=PATS[sn.pat]?sn.pat:'rock';S.pat=T.pat;
  if(typeof sn.swing==='number')S.swing=sn.swing;
  T.layers=sn.layers.map(l=>({id:T.nextId++,muted:!!l.muted,vol:l.vol==null?1:l.vol,rec:false,
    events:l.events.map(e=>({t:e.t,i:e.i,n:e.n,v:e.v,abs:-1}))}));
  T.loopLen=sn.loopLen;T.aligned=!!sn.aligned;T.state='loop';T.looping=false;T.wantBeat=!!sn.beat&&T.aligned;
  $('#bpmV').textContent=T.bpm;$('#patTxt').textContent=PATS[T.pat].name;
  if(autoplay&&AU.ctx)playLoop();
  renderLayers();updateBtns();save();
}
function wavBlob(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate,bytes=44+n*ch*2,ab=new ArrayBuffer(bytes),dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');dv.setUint32(4,bytes-8,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);
  dv.setUint16(22,ch,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*ch*2,true);dv.setUint16(32,ch*2,true);dv.setUint16(34,16,true);
  ws(36,'data');dv.setUint32(40,n*ch*2,true);
  const data=[];for(let c=0;c<ch;c++)data.push(buf.getChannelData(c));
  let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const s=Math.max(-1,Math.min(1,data[c][i]));dv.setInt16(o,s<0?s*0x8000:s*0x7fff,true);o+=2;}
  return new Blob([ab],{type:'audio/wav'});
}
async function renderSong(sn){
  const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const sr=44100,L=sn.loopLen,reps=Math.max(1,Math.min(Math.ceil(16/L),Math.floor(60/L)||1)),dur=L*reps+2.5;
  const off=new OC(2,Math.ceil(sr*dur),sr);
  const O=Object.create(AU);O.ctx=off;O.setup(off);
  for(let k=0;k<reps;k++)for(const lay of sn.layers){
    if(lay.muted)continue;
    for(const ev of lay.events)O.play(ev.i,ev.n,0.05+k*L+ev.t,Math.min(1.2,ev.v*(lay.vol==null?1:lay.vol)));
  }
  if(sn.beat&&PATS[sn.pat]){
    const P=PATS[sn.pat],sd=60/sn.bpm/4,plen=P.len||16,steps=Math.floor(L*reps/sd+0.001),sw=sn.swing||0;
    for(let i=0;i<steps;i++){
      const t=0.05+i*sd+((i&1)?sw*0.4*sd:0);
      P.steps[i%plen].forEach(([id,v])=>O.drum(id,t,v*0.9,O.beat));
    }
  }
  const buf=await off.startRendering();
  return wavBlob(buf);
}
async function shareAudio(sn,name){
  toast('Making your audio file…');
  let blob;
  try{blob=await renderSong(sn);}catch(e){toast('Could not make the audio file on this device');return;}
  const base=(name||'Pocket Band song').replace(/[^\w\- ]+/g,'').trim()||'Pocket Band song';
  try{
    const file=new File([blob],base+'.wav',{type:'audio/wav'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:base});return;}
      catch(e){if(e&&e.name==='AbortError')return;}
    }
  }catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=base+'.wav';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},5000);
  toast('Saved '+base+'.wav to your downloads');
}

const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11},NOTE_RE=/^([A-G])([#b]?)(\d)(?:\/(\d*\.?\d+))?$/;
function parseMel(s){
  return s.trim().split(/\s+/).map(t=>{
    const m=NOTE_RE.exec(t);if(!m)throw new Error('bad note '+t);
    return {m:12*(+m[3]+1)+SEMI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0),d:m[4]?+m[4]:1};
  });
}

function lStart(){stopFrames();lResetCounters();LN.running=true;LN.demo=false;lEl.over.style.display='none';LN.last=0;LN.raf=requestAnimationFrame(lFrame);}

function lFrame(ts){
  if(!LN.running)return;
  const dt=LN.last?Math.min(0.05,(ts-LN.last)/1000):0;LN.last=ts;
  lAdvance(dt);lDraw();

function flashLane(l){
  const b=lEl.lanes.children[l];if(!b)return;b.classList.add('hit');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('hit'),130);
}
function lAdvance(dt){
  let st=LN.st+dt;const follow=S.learn.mode==='follow'&&!LN.demo;
  if(follow){const nx=LN.notes.find(n=>!n.done);if(nx&&st>nx.t)st=nx.t;}
  LN.st=st;
  const lastN=LN.notes[LN.notes.length-1];
  if(LN.demo){
    for(const n of LN.notes)if(!n.done&&st>=n.t){n.done=true;AU.play(LN.inst,n.m,AU.ctx.currentTime,0.85);flashLane(n.lane);LN.fx.push({l:n.lane,t:performance.now()});}
    if(st>lastN.t+0.9){stopFrames();lResetCounters();lReady();}
    return;
  }
  if(!follow){
    for(const n of LN.notes)if(!n.done&&st-n.t>0.3){n.done=true;n.hit=0;LN.miss++;LN.combo=0;say('Miss');hud();}
  }
  let h=-1;
  if(follow){const nx=LN.notes.find(n=>!n.done);if(nx&&nx.t-st<0.9)h=nx.lane;}
  if(h!==LN.hint){
    lEl.lanes.querySelectorAll('.lane').forEach((b,i)=>b.classList.toggle('hint',i===h));LN.hint=h;
  }
  if(LN.notes.every(n=>n.done)&&st>lastN.t+0.7)lFinish();
}
function lanePress(l){
  AU.wake();if(!AU.ctx)return;
  AU.play(LN.inst,LN.lanes[l],AU.ctx.currentTime,0.85);buzz(8);flashLane(l);
  if(!LN.running||LN.demo)return;
  if(S.learn.mode==='follow'){
    const nx=LN.notes.find(n=>!n.done);if(!nx)return;
    if(nx.lane===l&&nx.t-LN.st<=0.6){
      nx.done=true;nx.hit=2;LN.perfect++;LN.combo++;LN.best=Math.max(LN.best,LN.combo);
      LN.score+=100+Math.min(LN.combo,10)*5;LN.fx.push({l,t:performance.now()});
    }else{LN.wrong++;LN.combo=0;}
  }else{
    let best=null,bd=1e9;
    for(const n of LN.notes){if(n.done||n.lane!==l)continue;const d=Math.abs(n.t-LN.st);if(d<bd){bd=d;best=n;}}
    if(best&&bd<=0.28){
      const p=bd<=0.12;best.done=true;best.hit=p?2:1;if(p)LN.perfect++;else LN.good++;
      LN.combo++;LN.best=Math.max(LN.best,LN.combo);LN.score+=(p?100:60)+Math.min(LN.combo,10)*5;
      LN.fx.push({l,t:performance.now()});say(p?'Perfect!':'Good');
    }else{LN.combo=0;LN.wrong++;}
  }
  hud();
}
function lFinish(){
  stopFrames();lDraw();

  if(S.learn.mode==='follow')stars=LN.wrong<=2?3:LN.wrong<=6?2:1;
  else{const acc=hits/total;stars=acc>=0.9?3:acc>=0.7?2:acc>=0.4?1:0;}
  const id=LN.song.id;if(stars>(S.learn.stars[id]||0)){S.learn.stars[id]=stars;save();}
  lOverlay('<div style="font-size:46px;color:#ffd24d;letter-spacing:4px"></div><div style="font-size:20px;font-weight:900"></div><div class="sh-sub"></div>',
    [['Play again',()=>{lResetCounters();lReady();},''],['Choose song',()=>lShow('pick'),'pri']]);
  const k=lEl.over.children;
  k[0].textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  k[1].textContent=stars?'Nice playing!':'Keep practicing!';
  k[2].textContent='Score '+LN.score+' · Best combo '+LN.best+' · '+(S.learn.mode==='follow'?'Wrong taps '+LN.wrong:'Perfect '+LN.perfect+' · Good '+LN.good+' · Missed '+LN.miss);
  buzz([30,40,30]);
}
function lResize(){
  const r=lEl.wrap.getBoundingClientRect();dpr=Math.min(3,window.devicePixelRatio||1);
  cW=Math.max(1,Math.round(r.width*dpr));cH=Math.max(1,Math.round(r.height*dpr));

}
function rr(x,y,w,h,r){cx.beginPath();if(cx.roundRect)cx.roundRect(x,y,w,h,r);else cx.rect(x,y,w,h);}
function lDraw(){
  const n=LN.lanes.length;cx.clearRect(0,0,cW,cH);if(!n)return;
  const lw=cW/n,hitY=cH*0.88;
  for(let i=0;i<n;i++){cx.fillStyle=i%2?'#ffffff08':'#ffffff10';cx.fillRect(i*lw,0,lw,cH);}
  cx.fillStyle='#ffffff12';cx.fillRect(0,hitY,cW,cH-hitY);
  cx.fillStyle='#ffffffd0';cx.fillRect(0,hitY,cW,3*dpr);
  const nx=(S.learn.mode==='follow'&&!LN.demo)?LN.notes.find(q=>!q.done):null;
  for(const nt of LN.notes){
    if(nt.done)continue;
    const y=hitY-(nt.t-LN.st)/LA*hitY;if(y<0)continue;
    const h=Math.max(36*dpr,Math.min(hitY*0.6,nt.d/LA*hitY*0.9));if(y-h>cH)continue;
    const x=nt.lane*lw+lw*0.1,w=lw*0.8;
    cx.fillStyle='hsl('+laneHue(nt.lane)+' 80% 58%)';rr(x,y-h,w,h,12*dpr);cx.fill();
    if(nt===nx&&nx.t-LN.st<0.9){cx.strokeStyle='#fff';cx.lineWidth=3*dpr;rr(x,y-h,w,h,12*dpr);cx.stroke();}
    cx.fillStyle='#0b1022cc';cx.font='900 '+Math.min(22*dpr,lw*0.4)+'px system-ui';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(NN[nt.m%12],x+w/2,y-18*dpr);
  }
  const now=performance.now();
  LN.fx=LN.fx.filter(f=>now-f.t<380);
  for(const f of LN.fx){
    const a=(now-f.t)/380;cx.strokeStyle='rgba(255,255,255,'+(1-a).toFixed(2)+')';cx.lineWidth=4*dpr;
    cx.beginPath();cx.arc(f.l*lw+lw/2,hitY,lw*(0.25+0.45*a),0,Math.PI*2);cx.stroke();
  }
}

const TRIVIA_OK=TRIVIA;
let trivOrder=[],trivI=0;
function trivNext(){
  if(trivI>=trivOrder.length){trivOrder=TRIVIA_OK.map((_,i)=>i);for(let i=trivOrder.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[trivOrder[i],trivOrder[j]]=[trivOrder[j],trivOrder[i]];}trivI=0;}
  return TRIVIA_OK[trivOrder[trivI++]];
}
function openTrivia(){
  openSheet('Music trivia',body=>{
    const c=el('div','sh-card'),big=el('div','sh-title'),sub=el('div','sh-sub');
    big.style.cssText='font-size:17px;line-height:1.4;font-weight:800;min-height:96px';
    const show=()=>{big.textContent=trivNext();sub.textContent='Fact '+trivI+' of '+TRIVIA_OK.length;};
    const b=el('button','sbtn pri');b.textContent='Another one';b.addEventListener('click',show);
    c.append(big,sub,b);body.appendChild(c);show();
  });
}
(()=>{let n=0,t0=0;
  $('#status').addEventListener('click',()=>{
    const now=performance.now();if(now-t0>2000)n=0;t0=now;n++;
    if(n>=5){n=0;openTrivia();}
  });
})();

const PKEY='tapband.pets.v1';
let PET={on:false,best:0,col:'black'};
try{const j=JSON.parse(localStorage.getItem(PKEY)||'null');if(j){PET.on=!!j.on;PET.best=j.best|0;if(PCOL[j.col])PET.col=j.col;}}catch(e){}
function savePet(){try{localStorage.setItem(PKEY,JSON.stringify(PET));}catch(e){}}

function openPets(){
  if(!PET.on){PET.on=true;savePet();toast('Pet Pals unlocked');}
  openSheet('Pet Pals',body=>{
    const c1=el('div','sh-card');
    const t1=el('div','sh-title');t1.textContent='Do not press';
    const s1=el('div','sh-sub');s1.textContent='Twenty unfortunate things your cat does. Pick a coat first.';
    const cr=el('div','sh-row');
    Object.keys(PCOL).forEach(k=>{
      const ch=el('button','chip'+(PET.col===k?' on':''));ch.textContent=k;
      ch.addEventListener('click',()=>{PET.col=k;savePet();[...cr.children].forEach(x=>x.classList.toggle('on',x===ch));});
      cr.appendChild(ch);
    });
    const dnp=el('button','sbtn pri');dnp.textContent='DO NOT PRESS';dnp.style.cssText='background:#ff3b4f;color:#fff;font-size:16px;padding:14px';
    const view=el('div');view.style.cssText='display:none;flex-direction:column;gap:6px';
    const nm=el('div','sh-title'),ds=el('div','sh-sub'),im=el('div'),ct=el('div','sh-sub');
    im.style.cssText='border-radius:12px;overflow:hidden';
    view.append(im,nm,ds,ct);
    let ord=[],oi=0;
    dnp.addEventListener('click',()=>{
      if(oi>=ord.length){ord=CAT_SCENES.map((_,i)=>i);for(let i=ord.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ord[i],ord[j]]=[ord[j],ord[i]];}oi=0;}
      const sc0=CAT_SCENES[ord[oi++]];
      im.innerHTML=sc0.f(PET.col);nm.textContent=sc0.t;ds.textContent=sc0.d;ct.textContent=oi+' of '+CAT_SCENES.length;
      view.style.display='flex';dnp.textContent='Pressed. Press again?';buzz(25);
    });
    c1.append(t1,s1,cr,dnp,view);body.appendChild(c1);

    const c2=el('div','sh-card');
    const t2=el('div','sh-title');t2.textContent='Ferret heist';
    const s2=el('div','sh-sub');s2.textContent='Two ferrets are trying to break into the room they are not allowed in. Tap a ferret to send it back. Three break-ins and they win.';
    const pb=el('button','sbtn pri');pb.textContent='Start game';
    const hud=el('div','sh-sub');hud.textContent='Best: '+PET.best;
    const gw=el('div');gw.style.cssText='display:none;border-radius:12px;overflow:hidden;touch-action:manipulation';
    pb.addEventListener('click',()=>{startFerretGame(gw,hud);gw.style.display='block';pb.textContent='Play again';gw.scrollIntoView({block:'nearest'});});
    c2.append(t2,s2,pb,hud,gw);body.appendChild(c2);
  });
}

  let score=0,strikes=0,over=false,last=performance.now(),mt=0;
  const HEAD=126;
  const hudSet=()=>{hud.textContent='Sent back: '+score+'   Break-ins: '+strikes+'/3   Best: '+PET.best;};
  const reset=(f,first)=>{f.x=first?f.x:-10;f.v=18+Math.min(score,40)*1.1+Math.random()*10;};
  fs.forEach(f=>{
    f.g.addEventListener('pointerdown',e=>{
      e.preventDefault();if(over)return;
      f.x=Math.max(-20,f.x-55);score++;buzz(12);
      M.setAttribute('transform','translate('+(f.x+50)+' '+(f.y-34)+')');M.setAttribute('opacity','1');mt=0.5;
      if(score>PET.best){PET.best=score;savePet();}
      hudSet();
    });
  });
  hudSet();
  function loop(now){
    if(run!==ferretRun||!host.isConnected)return;
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!over){
      fs.forEach(f=>{
        f.ph+=dt*9;
        f.x+=f.v*dt*(1+0.35*Math.sin(f.ph*0.6));
        if(f.x>=HEAD-50+10){
          strikes++;buzz(40);hudSet();
          if(strikes>=3){over=true;M.querySelector('text').textContent='They got in!';M.setAttribute('transform','translate(110 60)');M.setAttribute('opacity','1');mt=99;}
          reset(f);
        }
      });
    }
    fs.forEach(f=>{const bob=Math.sin(f.ph)*2.2;f.g.setAttribute('transform','translate('+f.x+' '+(f.y+bob)+')');});
    if(mt>0){mt-=dt;if(mt<=0)M.setAttribute('opacity','0');}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
(()=>{let n=0,t0=0;
  window.__petTap=()=>{
    const now=performance.now();if(now-t0>2500)n=0;t0=now;n++;
    if(n>=7){n=0;openPets();}
  };
})();

const splash=$('#splash');
splash.addEventListener('pointerup',()=>{AU.wake();splash.classList.add('hide');if(!AU._timer)AU._timer=setInterval(tick,25);});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}});}
/* touch browsers only allow audio to start after a finished tap, so retry on every finished gesture */
['pointerup','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(!AU.ctx||AU.ctx.state!=='running')AU.wake();},{capture:true,passive:true}));
let sndWarn=0;
setInterval(()=>{
  if(AU.ctx&&AU.ctx.state!=='running'&&splash.classList.contains('hide')){
    if(++sndWarn===2)toast('Sound is blocked. Tap the screen once more to turn it on.');
  }else sndWarn=0;
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume();});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.__tb={openTrivia,openPets,PET,TRIVIA,CAT_SCENES,FER_SCENES,T,AU,S,hit,onRec,onPlay,onUndo,onClear,tick,PATS,LN,LSONGS,loadSnap,snapshot,renderSong,lanePress,lStartSong,lStart,lDemo,wavBlob,stepTime,barLen};
})();
